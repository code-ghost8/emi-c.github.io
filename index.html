<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emily | Mis Redes</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins', sans-serif;}
  body{
    min-height:100vh;display:flex;justify-content:center;align-items:center;
    position:relative;overflow:hidden;padding:18px;
    background:#221122;
  }
  /* FONDO ADAPTADO */
  .bg{
    position:fixed;inset:0;z-index:0;
    background: url('fondo.jpg') center 35% / cover no-repeat;
    filter:brightness(0.95) contrast(1.05);
  }
  /* Capa oscura suave para que se lean los botones */
  .overlay{
    position:fixed;inset:0;z-index:1;
    background:radial-gradient(circle at 50% 45%, transparent 15%, rgba(0,0,0,0.35) 70%);
  }
  /* estrellitas */
  .stars{position:fixed;inset:0;z-index:2;pointer-events:none}
  .star{position:absolute;width:2px;height:2px;background:white;border-radius:50%;animation:twinkle 2.5s infinite alternate}
  @keyframes twinkle{0%{opacity:0.2}100%{opacity:1;box-shadow:0 0 8px white}}

  .container{
    position:relative;z-index:10;
    background:rgba(255,255,255,0.12);backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.25);border-radius:32px;
    padding:34px 26px;width:100%;max-width:380px;text-align:center;
    box-shadow:0 0 60px rgba(255,80,150,0.5), inset 0 0 20px rgba(255,255,255,0.1);
  }
  .avatar{
    width:118px;height:118px;border-radius:50%;border:3px solid #ff5ca1;
    margin:0 auto 14px;background:url('foto.jpg') center top / cover no-repeat, #2a2a2a;
    box-shadow:0 0 25px rgba(255,92,161,0.8), 0 0 0 4px rgba(255,255,255,0.15);
  }
  h1{font-size:24px;color:white;font-weight:700;text-shadow:0 0 12px #ff5ca1}
  .user{font-size:12px;color:#ffc7dd;margin:4px 0 22px;letter-spacing:1.2px;font-weight:600}
  .link{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;padding:14px;margin:12px 0;border-radius:50px;
    text-decoration:none;color:white;font-weight:600;transition:0.25s;font-size:15px;
  }
  .link:hover{transform:scale(1.04) translateY(-2px)}
  .tiktok{background:#000;border:1px solid #333}
  .whatsapp{background:linear-gradient(90deg,#128C7E,#25D366)}
  .instagram{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
  .facebook{background:linear-gradient(90deg,#1877F2,#4a7fe8)}
  .footer{margin-top:20px;font-size:10px;opacity:0.5;color:white}
</style>
</head>
<body>
<div class="bg"></div>
<div class="overlay"></div>
<div class="stars" id="stars"></div>

<div class="container">
  <div class="avatar"></div>
  <h1>Emily✨</h1>
  <div class="user">Hello Kitty 🐱🎀</div>
  <a class="link tiktok" href="https://www.tiktok.com/@nat_0925" target="_blank">🎵 TikTok</a>
  <a class="link whatsapp" href="https://wa.me/593969493007" target="_blank">💬 WhatsApp</a>
  <a class="link instagram" href="https://www.instagram.com/emilycz2009" target="_blank">📸 Instagram</a>
  <a class="link facebook" href="https://www.facebook.com/emily.cz23" target="_blank">📘 Facebook</a>
</div>

<script>
const s=document.getElementById('stars');
for(let i=0;i<120;i++){let e=document.createElement('div');e.className='star';e.style.left=Math.random()*100+'%';e.style.top=Math.random()*100+'%';e.style.animationDelay=Math.random()*3+'s';let z=Math.random()*2+1;e.style.width=z+'px';e.style.height=z+'px';s.appendChild(e);}
</script>
</body>
</html>
